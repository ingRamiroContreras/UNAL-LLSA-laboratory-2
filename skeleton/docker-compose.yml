services:
  passengers_db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=passengers_db
    volumes:
      - ./passengers_db/init.sql:/docker-entrypoint-initdb.d/init.sql
  routes_db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=routes_db
    volumes:
      - ./routes_db/init.sql:/docker-entrypoint-initdb.d/init.sql
  trains_db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=trains_db
    volumes:
      - ./trains_db/init.sql:/docker-entrypoint-initdb.d/init.sql
  tickets_db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=tickets_db
    volumes:
      - ./tickets_db/init.sql:/docker-entrypoint-initdb.d/init.sql
  dl:
    image: python:3.11-slim
    volumes:
      - ./dl:/app
    working_dir: /app
    command: python ingest.py
  onboard_unit:
    image: python:3.11-slim
    volumes:
      - ./onboard_unit:/app
    working_dir: /app
    command: python obu.py
  balise:
    image: python:3.11-slim
    volumes:
      - ./balise:/app
    working_dir: /app
    command: python balise.py
  leu:
    image: python:3.11-slim
    volumes:
      - ./leu:/app
    working_dir: /app
    command: python lineside_electronic.py
  brake_actuator:
    image: python:3.11-slim
    volumes:
      - ./brake_actuator:/app
    working_dir: /app
    command: python actuator.py
  gps_galileo:
    image: python:3.11-slim
    volumes:
      - ./gps_galileo:/app
    working_dir: /app
    command: python gps.py
  passengers_ms:
    build: ./passengers_ms
    ports:
      - '8000:80'
    depends_on:
      - passengers_db
      - routes_db
      - trains_db
      - tickets_db
  routes_ms:
    build: ./routes_ms
    ports:
      - '8001:80'
    depends_on:
      - passengers_db
      - routes_db
      - trains_db
      - tickets_db
  trains_ms:
    build: ./trains_ms
    ports:
      - '8002:80'
    depends_on:
      - passengers_db
      - routes_db
      - trains_db
      - tickets_db
  tickets_ms:
    build: ./tickets_ms
    ports:
      - '8003:80'
    depends_on:
      - passengers_db
      - routes_db
      - trains_db
      - tickets_db
  mas:
    build: ./mas
    ports:
      - '8004:80'
  ixl:
    build: ./ixl
    ports:
      - '8005:80'
  rbc:
    build: ./rbc
    ports:
      - '8006:80'
  api_gateway:
    build: ./api_gateway
    ports:
      - '8007:80'
  modem:
    image: python:3.11-slim
    volumes:
      - ./modem:/app
    working_dir: /app
    command: python gprs_modem.py
  portal:
    build: ./portal
    ports:
      - '8008:80'
  driver_interface:
    build: ./driver_interface
    ports:
      - '8009:80'

networks:
  default:
    driver: bridge
